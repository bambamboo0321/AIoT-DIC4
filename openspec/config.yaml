schema: spec-driven
context: |
  SmartIntake is a proposed fixed-workplace hydration and dietary tracking system.
  Manuscripts use IEEEtran conference English; author identities are pending.
  No formal E1-E5 measurements exist. Separate design, implementation and results.
  Private source files, credentials and personal records must not be published.
rules:
  proposal:
    - Include a separate goal.md explaining the DIC4 course objective.
  tasks:
    - Include compile, bibliography, rendered-page and independent ZIP verification.

